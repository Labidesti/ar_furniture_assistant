plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin" // Flutter plugin must be after Android/Kotlin
    id "com.google.gms.google-services"
}

android {
    namespace "com.mandauefoam.arassistant.ar_furniture_assistant"
    namespace 'com.goposse.flutterunitywidget'

    compileSdkVersion 33 // or flutter.compileSdkVersion if available
    ndkVersion = flutter.ndkVersion

    defaultConfig {
        applicationId "com.mandauefoam.arassistant.ar_furniture_assistant"
        minSdk = 24
        targetSdk = 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation project(":unityLibrary")
}
